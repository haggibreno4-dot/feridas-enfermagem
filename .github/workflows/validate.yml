name: DermeQuest validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in *.js tests/*.js; do
            [ -f "$file" ] && node --check "$file"
          done
